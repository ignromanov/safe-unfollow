<!-- @dsCard group="Colors" viewport="700x180" subtitle="The eleven relationship badges — 12% tint, 20% border, solid text" name="Badge palette" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--background);color:var(--foreground);font-family:'Inter',ui-sans-serif,system-ui}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:12px;border:1px solid var(--border)}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}.val{font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);opacity:.8}</style></head><body><div class="row" style="gap:8px"><span style="background:oklch(0.7 0.15 150 / 0.12);color:oklch(0.6 0.18 150);border:1px solid oklch(0.7 0.15 150 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Followers</span><span style="background:oklch(0.6 0.15 250 / 0.12);color:oklch(0.6 0.15 250);border:1px solid oklch(0.6 0.15 250 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Following</span><span style="background:oklch(0.6 0.22 25 / 0.15);color:oklch(0.55 0.25 25);border:1px solid oklch(0.6 0.22 25 / 0.3);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Recently unfollowed</span><span style="background:oklch(0.6 0.2 25 / 0.12);color:oklch(0.6 0.2 25);border:1px solid oklch(0.6 0.2 25 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Not following back</span><span style="background:oklch(0.6 0.18 264 / 0.12);color:oklch(0.6 0.18 264);border:1px solid oklch(0.6 0.18 264 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Mutuals</span><span style="background:oklch(0.75 0.15 80 / 0.12);color:oklch(0.7 0.18 80);border:1px solid oklch(0.75 0.15 80 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Not followed back</span><span style="background:oklch(0.7 0.15 50 / 0.12);color:oklch(0.65 0.18 50);border:1px solid oklch(0.7 0.15 50 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Pending request</span><span style="background:oklch(0.55 0.2 25 / 0.12);color:oklch(0.55 0.2 25);border:1px solid oklch(0.55 0.2 25 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Pending (permanent)</span><span style="background:oklch(0.5 0 0 / 0.12);color:oklch(0.4 0 0);border:1px solid oklch(0.5 0 0 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Restricted</span><span style="background:oklch(0.65 0.2 340 / 0.12);color:oklch(0.65 0.2 340);border:1px solid oklch(0.65 0.2 340 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Close friend</span><span style="background:oklch(0.5 0.05 250 / 0.12);color:oklch(0.5 0.05 250);border:1px solid oklch(0.5 0.05 250 / 0.2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;padding:4px 10px;border-radius:8px;line-height:1">Dismissed suggestion</span></div></body></html>
