<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--background);color:var(--foreground);font-family:'Inter',ui-sans-serif,system-ui}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:12px;border:1px solid var(--border)}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}.val{font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);opacity:.8}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:oklch(0.55 0.22 25)"></div><div class="lbl">destructive</div><div class="val">oklch(0.55 0.22 25)</div></div>
<div class="sw"><div class="chip" style="background:#10b981"></div><div class="lbl">emerald-500</div><div class="val">#10b981</div></div>
<div class="sw"><div class="chip" style="background:#f59e0b"></div><div class="lbl">amber-500</div><div class="val">#f59e0b</div></div>
<div class="sw"><div class="chip" style="background:#f43f5e"></div><div class="lbl">rose-500</div><div class="val">#f43f5e</div></div>
<div class="sw"><div class="chip" style="background:#6366f1"></div><div class="lbl">indigo-500</div><div class="val">#6366f1</div></div>
<div class="sw"><div class="chip" style="background:#3b82f6"></div><div class="lbl">blue-500</div><div class="val">#3b82f6</div></div>
</div></body></html>
