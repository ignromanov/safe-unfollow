<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Cards sit on shadow-sm and lift to shadow-xl on hover" name="Elevation" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--background);color:var(--foreground);font-family:'Inter',ui-sans-serif,system-ui}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:12px;border:1px solid var(--border)}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}.val{font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);opacity:.8}</style></head><body><div class="row" style="gap:20px"><div class="sw"><div style="width:110px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.05)"></div><div class="lbl">shadow-sm</div></div><div class="sw"><div style="width:110px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1)"></div><div class="lbl">shadow-md</div></div><div class="sw"><div style="width:110px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.1)"></div><div class="lbl">shadow-lg</div></div><div class="sw"><div style="width:110px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 20px 25px -5px rgb(0 0 0 / 0.1)"></div><div class="lbl">shadow-xl</div></div><div class="sw"><div style="width:110px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 25px 50px -12px oklch(0.6 0.18 264 / 0.3)"></div><div class="lbl">shadow-2xl brand</div></div></div></body></html>
