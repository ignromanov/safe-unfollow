<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--background);color:var(--foreground);font-family:'Inter',ui-sans-serif,system-ui}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:12px;border:1px solid var(--border)}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}.val{font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);opacity:.8}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:oklch(0.6 0.18 264)"></div><div class="lbl">primary</div><div class="val">oklch(0.6 0.18 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.65 0.22 285)"></div><div class="lbl">accent</div><div class="val">oklch(0.65 0.22 285)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.65 0.2 340)"></div><div class="lbl">secondary</div><div class="val">oklch(0.65 0.2 340)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.6 0.18 264)"></div><div class="lbl">ring</div><div class="val">oklch(0.6 0.18 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.6 0.18 264 / 0.1)"></div><div class="lbl">primary /10</div><div class="val">oklch(0.6 0.18 264 / 0.1)</div></div>
</div></body></html>
