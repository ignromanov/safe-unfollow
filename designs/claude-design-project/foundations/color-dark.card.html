<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--background);color:var(--foreground);font-family:'Inter',ui-sans-serif,system-ui}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:12px;border:1px solid var(--border)}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}.val{font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);opacity:.8}body{background:oklch(0.12 0.01 264);color:oklch(0.98 0.005 264)}.lbl,.val{color:oklch(0.75 0.02 264)}.chip{border-color:oklch(0.25 0.02 264)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:oklch(0.12 0.01 264)"></div><div class="lbl">background</div><div class="val">oklch(0.12 0.01 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.18 0.015 264)"></div><div class="lbl">card / popover</div><div class="val">oklch(0.18 0.015 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.25 0.02 264)"></div><div class="lbl">muted</div><div class="val">oklch(0.25 0.02 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.25 0.02 264)"></div><div class="lbl">border / input</div><div class="val">oklch(0.25 0.02 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.65 0.16 264)"></div><div class="lbl">primary</div><div class="val">oklch(0.65 0.16 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.7 0.2 285)"></div><div class="lbl">accent</div><div class="val">oklch(0.7 0.2 285)</div></div>
</div></body></html>
