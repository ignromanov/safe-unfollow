<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--background);color:var(--foreground);font-family:'Inter',ui-sans-serif,system-ui}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:12px;border:1px solid var(--border)}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}.val{font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);opacity:.8}</style></head><body><div class="row" style="gap:16px;align-items:center">
<button style="padding:16px 40px;border:0;border-radius:24px;background:oklch(0.6 0.18 264);color:#fff;font-weight:700;font-size:16px;box-shadow:0 25px 50px -12px oklch(0.6 0.18 264 / 0.3);transition:all .2s">Rest</button>
<button style="padding:16px 40px;border:0;border-radius:24px;background:oklch(0.6 0.18 264);color:#fff;font-weight:700;font-size:16px;box-shadow:0 25px 50px -12px oklch(0.6 0.18 264 / 0.3);transform:scale(1.02)">Hover · scale 1.02</button>
<button style="padding:16px 40px;border:0;border-radius:24px;background:oklch(0.6 0.18 264);color:#fff;font-weight:700;font-size:16px;transform:scale(.95)">Press · scale 0.95</button>
</div>
<div class="val" style="margin-top:16px;line-height:1.7">cards: hover:shadow-xl hover:-translate-y-1 · icons: group-hover:scale-110 · logo: group-hover:rotate-6<br>accordion 0.2s ease-out · all motion disabled under prefers-reduced-motion · hover effects reset on (hover:none)</div></body></html>
