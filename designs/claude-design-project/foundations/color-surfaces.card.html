<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--background);color:var(--foreground);font-family:'Inter',ui-sans-serif,system-ui}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:52px;border-radius:12px;border:1px solid var(--border)}.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}.val{font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-foreground);opacity:.8}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:oklch(0.99 0.005 264)"></div><div class="lbl">background</div><div class="val">oklch(0.99 0.005 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(1 0 0)"></div><div class="lbl">card / popover</div><div class="val">oklch(1 0 0)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.96 0.005 264)"></div><div class="lbl">muted</div><div class="val">oklch(0.96 0.005 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.92 0.01 264)"></div><div class="lbl">border / input</div><div class="val">oklch(0.92 0.01 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.55 0.02 264)"></div><div class="lbl">muted-foreground</div><div class="val">oklch(0.55 0.02 264)</div></div>
<div class="sw"><div class="chip" style="background:oklch(0.15 0.01 264)"></div><div class="lbl">foreground</div><div class="val">oklch(0.15 0.01 264)</div></div>
</div></body></html>
