<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />

    <!-- Resource hint for the BMC widget. DNS only, deliberately not a
         preconnect: this head is shared by all 88 prerendered pages, but the
         widget script loads on /results and /sample alone — a preconnect would
         open a TCP+TLS socket on every other page that goes unused and gets
         closed. Google's ad origin gets no hint at all: AdSlot requests a fill
         only once the reader scrolls near it, long after the critical path. -->
    <link rel="dns-prefetch" href="https://cdnjs.buymeacoffee.com" />

    <!-- Font preload: critical latin-normal subsets loaded BEFORE CSS parse.
         Paths reference @fontsource-variable source files; Vite resolves them at build time
         via the CSS @import in styles.css. These <link> tags give the browser an early hint. -->
    <link rel="preload" href="/src/styles.css" as="style" />

    <!-- CRITICAL: Language redirect MUST be first script - before any other resources load -->
    <script>
      (function() {
        var STORE_KEY = 'unfollow-radar-store';
        // SYNC with src/config/languages.ts NON_ENGLISH_LANGUAGES
        var NON_EN_LANGS = ['ar','de','es','fr','id','ja','pt','ru','tr'];

        // Skip if path already has language prefix
        var path = location.pathname;
        for (var i = 0; i < NON_EN_LANGS.length; i++) {
          var prefix = '/' + NON_EN_LANGS[i];
          if (path === prefix || path.startsWith(prefix + '/')) return;
        }

        try {
          // Only an explicit language preference redirects (set by LanguageSwitcher via
          // persistLanguageSync()). A first visit with no stored choice stays on the
          // English path it asked for - guessing the browser's language cost a full
          // second document load (Google also advises against this: "Avoid automatically
          // redirecting users from one language version of a site to a different language
          // version of a site").
          var store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
          var storedLang = store.state && store.state.language;

          if (storedLang) {
            // User has explicit preference - respect it
            if (storedLang !== 'en' && NON_EN_LANGS.indexOf(storedLang) !== -1) {
              location.href = '/' + storedLang + path + location.search + location.hash;
            }
            // storedLang is 'en' - stay on English path
          }
        } catch (e) {
          // localStorage unavailable (private mode) - continue with English
        }
      })();
    </script>

    <!-- GH#36 — hand vite-react-ssg its static loader data so it never fetches for it.

         Every prerendered page carries [data-server-rendered=true], and on that
         signal vite-react-ssg injects a loader onto EVERY route during hydration
         (node_modules/vite-react-ssg/dist/index.mjs:184). That loader fetches
         /static-loader-data-manifest-<hash>.json and calls .json() on the response
         with no response.ok check and no try/catch (:171). The hash is
         Math.random().toString(36) (shared/vite-react-ssg.qp2k9AZ2.mjs:705), NOT
         derived from content, so every deploy orphans the previous filename — and
         any page served from the service worker's week-long pages-cache asks for a
         file that no longer exists. Vercel answers that with 404 AND an HTML body,
         .json() throws, and a loader rejection goes straight to the router's
         errorElement: 263 route_error events, 24 Jul - 12 Aug 2026.

         The variable short-circuits the fetch entirely (:167-169). {} is the correct
         value, not a stub: the real manifest holds null for every route, because no
         route in this app declares a loader, and the loader ends in `routeData ??
         null` either way. src/__tests__/build/ssg-loader-manifest.test.ts asserts
         that stays true, so adding a real SSG loader fails the build rather than
         silently losing its data here.

         Declaring `loader` on our own routes does NOT work: the transform assigns
         route.loader unconditionally and overwrites it. -->
    <script>
      window.__VITE_REACT_SSG_STATIC_LOADER_DATA__ = {};
    </script>

    <!-- Preload critical fonts to reduce LCP -->
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Meta tags below are replaced by vite.config.ts onPageRendered for each language -->
    <meta name="description" content="Check who unfollowed you on Instagram without login. Upload your ZIP file, see unfollowers instantly. 100% free, privacy-first, handles 1M+ accounts." />
    <meta name="keywords" content="instagram unfollow tracker, who unfollowed me instagram, instagram followers analysis, instagram unfollow app, instagram mutual followers" />
    <meta name="theme-color" content="#4E7EF5" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Instagram Unfollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- PWA manifest is injected by vite-plugin-pwa -->

    <!-- Open Graph / Facebook (replaced by SSG for each language) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://safeunfollow.app/" />
    <meta property="og:title" content="Instagram Unfollowers — Free ZIP Upload, No Login" />
    <meta property="og:description" content="Find who unfollowed you on Instagram. 100% free, 100% private, handles 1M+ accounts." />
    <meta property="og:site_name" content="Safe Unfollow" />
    <meta property="og:image" content="https://safeunfollow.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- og:locale and og:locale:alternate injected by SSG -->

    <!-- Twitter (replaced by SSG for each language) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://safeunfollow.app/" />
    <meta name="twitter:title" content="Instagram Unfollowers — Free ZIP Upload, No Login" />
    <meta name="twitter:description" content="Find Instagram unfollowers in your browser. Free forever, no login, handles millions." />
    <meta name="twitter:image" content="https://safeunfollow.app/og-image.png" />

    <!-- Additional SEO -->
    <meta name="author" content="Ignat Romanov" />
    <meta name="robots" content="index, follow" />
    <!-- canonical, hreflang injected by vite.config.ts onPageRendered -->
    <title>Instagram Unfollowers — Free ZIP Upload, No Login Required</title>

    <!-- Schema.org structured data rendered dynamically by OrganizationSchema.tsx (homepage only) -->

    <!-- Google AdSense ownership verification. Inert meta-tag method (no
         cookies, no network calls), present on every prerendered page for
         Google's site review. The adsbygoogle.js script is injected at runtime
         only for eligible (geo-allowed, non-sample) visitors — see
         src/lib/ads/loader.ts — so no ad tracker loads in the EEA/UK/CH. -->
    <meta name="google-adsense-account" content="ca-pub-5976295812261948" />
  </head>

  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
