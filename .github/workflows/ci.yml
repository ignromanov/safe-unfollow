name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      # The only job with a dist/ to measure. Unwired, the budget guard cannot fail.
      - run: npm run perf:budget
      - run: npm test --ignore-scripts
