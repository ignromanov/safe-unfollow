name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # A superseded run proves nothing. Cancel only PR runs: a cancelled push to
  # main would leave the default branch with no verdict at all.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # First because it is the cheapest gate. Until 2026-08-19 nothing here ran
      # `format:check`, so formatting was enforced only by lint-staged at commit
      # time — which globs *.{ts,tsx,json,md} and so can never reach .html, .css,
      # .yml or .mjs, and which does not run at all in a fresh `git worktree`,
      # because husky installs its hooks from `prepare` on npm install.
      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint:strict

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage/clover.xml
          fail_ci_if_error: false
