<?xml version="1.0" encoding="UTF-8"?>
<!--
  SafeUnfollow.app V3 Master Logo (Reference SVG)
  - Pure single-path fill-rule="evenodd" shield + cutout checkmark (zero <mask> issues)
  - Bounding box: 264x318 (51.6% width), max radius 164px from center -> passes BOTH
    Android maskable 80% safe-zone (r=204.8px) AND Google/IG/TikTok/YouTube circle crops
  - Brand gradient (135deg): #5B6BE0 -> #9B5DE5 -> #E05B9B + subtle top radial sheen
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6BE0" />
      <stop offset="50%" stop-color="#9B5DE5" />
      <stop offset="100%" stop-color="#E05B9B" />
    </linearGradient>
    <radialGradient id="topSheen" cx="28%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="0" ry="0" fill="url(#brandGradient)" />
  <rect x="0" y="0" width="512" height="512" rx="0" ry="0" fill="url(#topSheen)" />

  <path fill="#FFFFFF" fill-rule="evenodd" d="M 256 98 C 262 98 268 100 273 104 C 302 126 336 136 368 138 C 380 139 388 147 388 160 L 388 242 C 388 324 334 382 266 413 C 260 416 252 416 246 413 C 178 382 124 324 124 242 L 124 160 C 124 147 132 139 144 138 C 176 136 210 126 239 104 C 244 100 250 98 256 98 Z M 207.2 230.8 A 21.5 21.5 0 0 0 176.8 261.2 L 220.8 305.2 A 21.5 21.5 0 0 0 251.2 305.2 L 339.2 217.2 A 21.5 21.5 0 0 0 308.8 186.8 L 236.0 259.59 Z" />
</svg>
