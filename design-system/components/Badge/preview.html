<!-- @dsCard group="Data display" height=130 subtitle="Static rendition: 4 variants plus the two status pills" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        display: grid;
        gap: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .g {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: var(--radius-md);
        border: 1px solid transparent;
        font: 500 12px/16px var(--font-sans);
        white-space: nowrap;
      }
      .default {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      .destructive {
        background: var(--destructive);
        color: #fff;
      }
      [data-theme='dark'] .destructive {
        background: color-mix(in oklab, var(--destructive) 60%, transparent);
      }
      .outline {
        border-color: var(--border);
        color: var(--foreground);
      }
      .neg {
        background: var(--badge-negative-bg);
        color: var(--badge-negative-fg);
        border-radius: 999px;
        padding: 4px 10px;
        font-weight: 600;
      }
      .info {
        background: var(--badge-info-bg);
        color: var(--badge-info-fg);
        border-radius: 999px;
        padding: 4px 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="g default">Default</span><span class="g secondary">Secondary</span
      ><span class="g destructive">Destructive</span><span class="g outline">Outline</span>
    </div>
    <div class="row">
      <span class="g neg">Not following back</span><span class="g info">Following</span>
    </div>
  </body>
</html>
