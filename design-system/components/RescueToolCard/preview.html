<!-- @dsCard group="Monetization" height=300 subtitle="Static rendition: recommended and standard cards" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
      }
      svg.i {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      body {
        padding: 24px;
      }
      .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        max-width: 560px;
      }
      .c {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 16px;
        border: 2px solid #e4e4e7;
        border-radius: 16px;
        background: #fff;
        color: inherit;
        text-decoration: none;
      }
      [data-theme='dark'] .c {
        background: #18181b;
        border-color: #27272a;
      }
      .c.f {
        border-color: #d4d4d8;
      }
      [data-theme='dark'] .c.f {
        border-color: #3f3f46;
      }
      .tg {
        position: absolute;
        top: -8px;
        padding: 2px 8px;
        border-radius: 999px;
        font: 700 12px/16px var(--font-sans);
      }
      .rc {
        inset-inline-start: 12px;
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .pp {
        inset-inline-end: -8px;
        background: #f97316;
        color: #fff;
      }
      .hd {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 4px;
      }
      .hd b {
        font: 700 16px/24px var(--font-sans);
        color: #18181b;
      }
      [data-theme='dark'] .hd b {
        color: #fff;
      }
      .tr {
        display: flex;
        gap: 8px;
        font: 400 12px/16px var(--font-sans);
        margin-bottom: 8px;
      }
      .tr .pr {
        color: #059669;
        font-weight: 600;
      }
      [data-theme='dark'] .tr .pr {
        color: #34d399;
      }
      .tr .sc {
        color: #a1a1aa;
      }
      .tr .dt {
        color: #d4d4d8;
      }
      .ds {
        margin: 0 0 12px;
        font: 400 14px/20px var(--font-sans);
        color: #71717a;
        flex-grow: 1;
      }
      [data-theme='dark'] .ds {
        color: #a1a1aa;
      }
      .bt {
        padding: 8px 12px;
        border-radius: var(--radius-xl);
        text-align: center;
        font: 600 14px/20px var(--font-sans);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        background: #f4f4f5;
        color: #3f3f46;
      }
      [data-theme='dark'] .bt {
        background: #27272a;
        color: #d4d4d8;
      }
      .f .bt {
        background: var(--primary);
        color: var(--primary-foreground);
      }
    </style>
  </head>
  <body>
    <div class="g">
      <a class="c f" href="#"
        ><span class="tg rc">Recommended</span>
        <div class="hd">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" style="color: #6366f1">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" /></svg
          ><b>Publer</b>
        </div>
        <div class="tr">
          <span class="pr">Free plan available</span><span class="dt">•</span
          ><span class="sc">1.8M+ downloads</span>
        </div>
        <p class="ds">Schedule posts › stay consistent &amp; grow 2x faster</p>
        <div class="bt">
          Get My Publer Trial<svg
            class="i"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            style="opacity: 0.7"
          >
            <path
              d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
            />
          </svg></div
      ></a>
      <a class="c" href="#"
        ><span class="tg pp">Popular</span>
        <div class="hd">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" style="color: #f97316">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" /></svg
          ><b>Metricool</b>
        </div>
        <div class="tr">
          <span class="pr">Free plan available</span><span class="dt">•</span
          ><span class="sc">3.5M+ professionals</span>
        </div>
        <p class="ds">Find your peak times › 40% faster growth</p>
        <div class="bt">
          Get My Metricool Trial<svg
            class="i"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            style="opacity: 0.7"
          >
            <path
              d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
            />
          </svg></div
      ></a>
    </div>
  </body>
</html>
