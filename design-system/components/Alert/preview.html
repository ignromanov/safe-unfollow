<!-- @dsCard group="Feedback" height=200 subtitle="Static rendition: default and destructive" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        display: grid;
        gap: 12px;
        max-width: 480px;
      }
      .a {
        display: grid;
        grid-template-columns: 16px 1fr;
        column-gap: 12px;
        row-gap: 2px;
        align-items: start;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--card);
        color: var(--card-foreground);
        font-size: 14px;
        line-height: 20px;
      }
      .a svg {
        width: 16px;
        height: 16px;
        transform: translateY(2px);
      }
      .t {
        grid-column: 2;
        font-weight: 500;
        letter-spacing: -0.025em;
        min-height: 16px;
      }
      .d {
        grid-column: 2;
        color: var(--muted-foreground);
        line-height: 1.625;
      }
      .x {
        color: var(--destructive);
      }
      .x .d {
        color: color-mix(in oklab, var(--destructive) 90%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="a" role="alert">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4M12 8h.01" />
      </svg>
      <div class="t">Your export stays in this browser</div>
      <div class="d">
        The analysis runs locally. Analytics and ads load separately and never receive your file.
      </div>
    </div>
    <div class="a x" role="alert">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="m15 9-6 6M9 9l6 6" />
      </svg>
      <div class="t">Could not read this file</div>
      <div class="d">Choose the ZIP you downloaded from Instagram, JSON or HTML.</div>
    </div>
  </body>
</html>
