<!doctype html>

      }

        stroke: currentColor;

        stroke-linejoin: round;
      }
      body {

      .f {

      .in {

      .b {

        align-items: center;
        gap: 16px;
      }
      .wm {
        font: 800 30px/1 var(--font-display);
        letter-spacing: -0.025em;
      }
      .wm b {
        color: var(--primary-strong);
        font-weight: 800;
      }
      .d {
        margin: 0;
        max-width: 384px;
        font: 500 16px/1.625 var(--font-sans);
        color: #71717a;
      }
      [data-theme='dark'] .d {
        color: #a1a1aa;
      }
      .n {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 48px;
        font: 900 12px/16px var(--font-sans);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #a1a1aa;
      }
      .n a {
        padding: 8px 4px;
        color: inherit;
        text-decoration: none;
      }
      .n a:hover {
        color: var(--primary-strong);
      }
      .c {
        font-size: 12px;
        color: var(--muted-foreground);
      }
    </style>
