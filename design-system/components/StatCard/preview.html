<!-- @dsCard group="Data display" height=210 subtitle="Static rendition: rest and active" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .c {
        box-sizing: border-box;
        width: 200px;
        padding: 24px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--card);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        text-align: start;
        box-shadow: 0 1px 2px rgb(0 0 0/0.05);
        font: inherit;
        color: inherit;
      }
      .i {
        padding: 10px;
        border-radius: var(--radius-xl);
        background: var(--muted);
        display: flex;
      }
      .i svg {
        width: 18px;
        height: 18px;
      }
      .v {
        font: 800 30px/1 var(--font-display);
        letter-spacing: -0.025em;
        color: var(--foreground);
      }
      .l {
        margin-top: 4px;
        font: 900 12px/1 var(--font-sans);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #a1a1aa;
      }
      .on {
        background: var(--primary);
        border-color: var(--primary);
        box-shadow:
          0 10px 15px -3px rgb(0 0 0/0.1),
          0 4px 6px -4px rgb(0 0 0/0.1);
        transform: scale(1.02);
      }
      .on .i {
        background: rgb(255 255 255/0.2);
        color: var(--primary-foreground);
      }
      .on .v {
        color: var(--primary-foreground);
      }
      .on .l {
        color: color-mix(in oklab, var(--primary-foreground) 90%, transparent);
      }
    </style>
  </head>
  <body>
    <button class="c" aria-pressed="false">
      <span class="i" style="color: #f43f5e"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 17l-8.5-8.5-5 5L2 7M16 17h6v-6" /></svg></span
      ><span
        ><div class="v">150</div>
        <div class="l">Not following</div></span
      >
    </button>
    <button class="c on" aria-pressed="true">
      <span class="i"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="m15 9-6 6M9 9l6 6" /></svg></span
      ><span
        ><div class="v">80</div>
        <div class="l">Unfollowed</div></span
      >
    </button>
  </body>
</html>
