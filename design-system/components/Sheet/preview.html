<!-- @dsCard group="Overlays" height=340 subtitle="Static rendition: bottom sheet on a phone-width scrim" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
      }
      svg.i {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sc {
        position: relative;
        width: 390px;
        height: 340px;
        margin: auto;
        overflow: hidden;
        background: rgb(0 0 0/0.5);
        outline: 1px solid var(--border);
      }
      .bg {
        position: absolute;
        inset: 0;
        background: var(--background);
        z-index: -1;
      }
      .sh {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        box-sizing: border-box;
        padding: 20px 20px 28px;
        border-top: 1px solid var(--border);
        border-radius: 32px 32px 0 0;
        background: var(--card);
        box-shadow: 0 10px 15px -3px rgb(0 0 0/0.1);
      }
      .hr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      h2 {
        margin: 0;
        font: 600 18px/1.375 var(--font-sans);
      }
      .x {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--foreground);
        opacity: 0.7;
        display: grid;
        place-items: center;
      }
      .o {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        margin-bottom: 8px;
        border: 1px solid var(--border);
        border-radius: 16px;
        font: 600 14px/20px var(--font-sans);
      }
      .o.on {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="sc">
      <div class="sh" role="dialog" aria-labelledby="t">
        <div class="hr">
          <h2 id="t">Export</h2>
          <button class="x" aria-label="Close">
            <svg class="i" width="16" height="16" viewBox="0 0 24 24">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="o on">Not following back<span>150</span></div>
        <div class="o">Unfollowed<span>80</span></div>
        <div class="o">Mutuals<span>262</span></div>
      </div>
    </div>
  </body>
</html>
