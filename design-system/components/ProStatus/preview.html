<!-- @dsCard group="Pro v1.8 (concept)" height=780 subtitle="Concept: connecting Pro, status, expiry" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        display: flex;
        flex-wrap: wrap;
        gap: 32px 24px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
        display: grid;
        gap: 8px;
      }
      figcaption {
        font: 500 12px/16px var(--font-sans);
        color: var(--muted-foreground);
      }
      /* scrim + sheet: ExportSheet below 640px */
      .sc {
        width: 390px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-top: 32px;
        background: linear-gradient(rgb(0 0 0 / 0.5), rgb(0 0 0 / 0.5)), var(--background);
        outline: 1px solid var(--border);
        overflow: hidden;
      }
      .sc.wide {
        width: 440px;
        justify-content: center;
        padding: 32px 24px;
      }
      .sh {
        position: relative;
        display: grid;
        gap: 16px;
        padding: 24px 20px 28px;
        border: 1px solid var(--border);
        border-bottom: 0;
        border-radius: 24px 24px 0 0;
        background: var(--background);
        box-shadow: 0 -8px 30px rgb(0 0 0 / 0.12);
      }
      .sh.dk {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow:
          0 10px 15px -3px rgb(0 0 0 / 0.1),
          0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      .gr {
        position: absolute;
        top: 8px;
        inset-inline-start: 50%;
        width: 36px;
        height: 4px;
        margin-inline-start: -18px;
        border-radius: 999px;
        background: var(--border);
      }
      .x {
        position: absolute;
        top: 4px;
        inset-inline-end: 4px;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--foreground);
        opacity: 0.7;
      }
      .hd {
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: start;
      }
      .hd.pe {
        padding-inline-end: 32px;
      }
      h2 {
        margin: 0;
        font: 600 18px/1.375 var(--font-sans);
      }
      h2.ti {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ds {
        margin: 0;
        font: 400 14px/20px var(--font-sans);
        color: var(--muted-foreground);
      }
      .ds.fg {
        color: var(--foreground);
        line-height: 1.625;
      }
      .ft {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .ft.tight {
        gap: 4px;
      }
      .em {
        color: #10b981;
        flex: none;
      }
      .xs {
        margin: 0;
        font: 400 12px/1.5 var(--font-sans);
        color: var(--muted-foreground);
      }
      .al {
        margin: 0;
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font: 400 14px/1.5 var(--font-sans);
        color: var(--destructive);
      }
      .al svg {
        margin-top: 2px;
        flex: none;
      }
      /* buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 24px;
        border: 1px solid transparent;
        border-radius: 16px;
        font: 700 14px/20px var(--font-sans);
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }
      .pri {
        background: var(--primary);
        color: var(--primary-foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .gh {
        background: transparent;
        color: var(--muted-foreground);
      }
      .dis {
        opacity: 0.5;
        pointer-events: none;
      }
      .spin {
        animation: spin 1s linear infinite;
        display: inline-flex;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
      }
      /* format buttons */
      .fmt {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: 48px;
        padding: 8px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--background);
        color: var(--foreground);
        text-align: start;
        font: 700 14px/20px var(--font-sans);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      [data-theme='dark'] .fmt:not(.pri) {
        background: color-mix(in oklab, var(--input) 30%, transparent);
        border-color: var(--input);
      }
      .fmt.pri {
        border-color: transparent;
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .fmt .l {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .fmt .h {
        font-weight: 400;
        font-size: 12px;
        line-height: 16px;
        color: var(--muted-foreground);
        white-space: normal;
      }
      .fmt.pri .h {
        color: color-mix(in oklab, var(--primary-foreground) 80%, transparent);
      }
      /* input */
      .in {
        height: 48px;
        width: 100%;
        padding: 4px 12px;
        border: 1px solid var(--input);
        border-radius: 16px;
        background: transparent;
        color: var(--foreground);
        font: 400 16px/24px var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      [data-theme='dark'] .in {
        background: color-mix(in oklab, var(--input) 30%, transparent);
      }
      .in::placeholder {
        color: var(--muted-foreground);
      }
      .in.inv {
        border-color: var(--destructive);
        outline: 3px solid color-mix(in oklab, var(--destructive) 20%, transparent);
      }

      .dsc {
        font: 500 11px/16px var(--font-sans);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font: 700 11px/16px var(--font-sans);
        color: var(--primary-strong);
        background: var(--background);
      }
      .pg {
        width: 390px;
        padding: 16px;
        display: grid;
        gap: 16px;
        background: var(--background);
        outline: 1px solid var(--border);
        align-content: start;
      }
      .card {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--card);
        display: grid;
        gap: 12px;
      }
      .tt {
        margin: 0;
        font: 700 16px/24px var(--font-sans);
      }
      .tt2 {
        margin: 0;
        font: 700 20px/28px var(--font-sans);
      }
      .mut {
        margin: 0;
        font: 400 14px/20px var(--font-sans);
        color: var(--muted-foreground);
      }
      .fgt {
        margin: 0;
        font: 400 14px/1.5 var(--font-sans);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sp {
        justify-content: space-between;
      }
      .num {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .sm2 {
        min-height: 40px;
        padding: 0 16px;
        border-radius: 12px;
        font-size: 14px;
      }
      .outl {
        background: var(--background);
        color: var(--foreground);
        border-color: var(--border);
      }
      [data-theme='dark'] .outl {
        background: color-mix(in oklab, var(--input) 30%, transparent);
        border-color: var(--input);
      }
      .tl {
        align-self: center;
        padding: 8px 4px;
        border: 0;
        background: none;
        font: 400 12px/16px var(--font-sans);
        color: var(--muted-foreground);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .ctr {
        text-align: center;
      }
      .tlk {
        color: var(--muted-foreground);
        flex: none;
      }
      /* benefits */
      .bn {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .bn li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font: 400 14px/20px var(--font-sans);
      }
      .bn svg {
        flex: none;
        margin-top: 2px;
      }
      /* pass picker */
      .pk {
        display: grid;
        gap: 8px;
      }
      .pr {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--background);
      }
      .pr.on {
        border: 2px solid var(--primary);
        padding: 0 15px;
        background: color-mix(in oklab, var(--primary) 8%, var(--background));
      }
      .rd {
        width: 20px;
        height: 20px;
        flex: none;
        border: 2px solid var(--muted-foreground);
        border-radius: 50%;
      }
      .on .rd {
        border-color: var(--primary);
        background: radial-gradient(circle, var(--primary) 5px, transparent 6px);
      }
      .pl {
        flex: 1;
        font: 600 14px/20px var(--font-sans);
      }
      .pp {
        font: 700 16px/24px var(--font-sans);
        font-variant-numeric: tabular-nums;
      }
      .cta {
        font-size: 16px;
        padding: 0 20px;
        box-shadow: 0 25px 50px -12px color-mix(in oklab, var(--primary) 30%, transparent);
      }
      /* locked strips and skeletons */
      .sk {
        display: block;
        height: 14px;
        border-radius: 6px;
        background: var(--muted);
      }
      .lkw {
        position: relative;
        display: grid;
        gap: 10px;
        padding: 12px 0;
      }
      .lkp {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .lkb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--background);
        color: var(--foreground);
        font: 600 13px/16px var(--font-sans);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
      }
      .rl {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 48px;
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--background);
        font: 400 14px/20px var(--font-sans);
      }
      .rl .num {
        margin-inline-start: auto;
      }
      .acc {
        display: grid;
        gap: 2px;
        padding: 8px 0;
        border-top: 1px solid var(--border);
      }
      .acc:first-of-type {
        border-top: 0;
      }
      .acc b {
        font: 600 14px/20px var(--font-sans);
      }
      .acc span {
        font: 400 12px/16px var(--font-sans);
        color: var(--muted-foreground);
      }
      /* progress */
      .pb {
        display: flex;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--muted);
      }
      .pb i {
        display: block;
        height: 100%;
      }
      .pb .f {
        background: var(--primary);
      }
      .pb .l {
        background: repeating-linear-gradient(
          135deg,
          var(--muted-foreground) 0 2px,
          transparent 2px 6px
        );
        opacity: 0.35;
      }
      .nt {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--muted);
        font: 400 12px/1.5 var(--font-sans);
        color: var(--foreground);
      }
      .nt svg {
        flex: none;
        margin-top: 1px;
        color: var(--muted-foreground);
      }
      .ad {
        display: grid;
        place-items: center;
        height: 72px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        font: 500 11px/16px var(--font-sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      a.btn {
        text-decoration: none;
      }
      .btn.fmt {
        align-items: center;
      }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>After payment</figcaption>
      <div class="sc">
        <div class="sh" role="dialog">
          <div class="gr"></div>
          <button class="x" aria-label="Close">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
          <div style="display: flex; flex-direction: column; gap: 12px" role="status">
            <div class="hd pe">
              <h2 class="ti">
                <svg
                  class="em"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M20 6 9 17l-5-5" /></svg
                >Pro is on
              </h2>
              <p class="ds">Active until 17 Dec 2026 in this browser.</p>
            </div>
            <p class="fgt">
              Ad scripts and Google Analytics are not loaded. Reload once to switch them off on this
              page.
            </p>
            <div class="col2" style="display: flex; flex-direction: column; gap: 6px">
              <span
                class="kl"
                style="font: 600 12px/16px var(--font-sans); color: var(--muted-foreground)"
                >Your key</span
              ><span
                style="
                  padding: 8px 12px;
                  border: 1px solid var(--border);
                  border-radius: 16px;
                  background: var(--muted);
                  font:
                    400 14px/20px ui-monospace,
                    Menlo,
                    monospace;
                "
                >••••••••3f9a</span
              >
            </div>
          </div>
          <div class="ft">
            <button class="btn pri">Reload</button
            ><button class="btn fmt" style="justify-content: center; flex-direction: row">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
                <path d="m16 6-4-4-4 4" />
                <path d="M12 2v13" /></svg
              >Save your key
            </button>
          </div>
        </div>
      </div>
    </figure>
    <figure>
      <figcaption>Entering a key (second device)</figcaption>
      <div class="sc">
        <div class="sh" role="dialog">
          <div class="gr"></div>
          <button class="x" aria-label="Close">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
          <div class="hd pe">
            <h2>Unlock Pro</h2>
            <p class="ds">Enter the license key from your purchase email.</p>
          </div>
          <div style="display: flex; gap: 8px">
            <input
              class="in"
              placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"
              aria-label="License key"
              style="min-width: 0"
            /><button
              class="btn fmt"
              style="min-height: 48px; padding: 0 16px; flex-direction: row; gap: 6px"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
                <path
                  d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                /></svg
              >Paste
            </button>
          </div>
          <div class="ft"><button class="btn pri">Unlock this browser</button></div>
          <button class="tl">Cannot find your key?</button>
        </div>
      </div>
    </figure>
    <figure>
      <figcaption>Settings: Your Pro</figcaption>
      <div class="pg">
        <div class="card">
          <div class="row sp">
            <p class="tt">Your Pro</p>
            <span class="tag">Active</span>
          </div>
          <p class="fgt">1 year · until 17 Nov 2027</p>
          <p class="xs">Key ••••••••3f9a · saved in this browser</p>
          <div class="ft tight">
            <button
              class="btn fmt sm2"
              style="min-height: 40px; flex-direction: row; justify-content: center"
            >
              Find my key</button
            ><button class="btn gh sm2">Remove from this browser</button>
          </div>
        </div>
        <div class="card">
          <div class="row sp">
            <p class="tt">Your Pro</p>
            <span class="tag">No end date</span>
          </div>
          <p class="fgt">Earlier purchase: Pro with no end date.</p>
        </div>
      </div>
    </figure>
    <figure>
      <figcaption>Pass ended</figcaption>
      <div class="sc">
        <div class="sh" role="dialog">
          <div class="gr"></div>
          <button class="x" aria-label="Close">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
          <div class="hd pe">
            <h2>Your 30 days ended</h2>
            <p class="ds">
              Pro is off in this browser and ads are back. Your marks and Keep list are still here.
            </p>
          </div>
          <div class="ft">
            <button class="btn pri">Renew</button
            ><button class="btn fmt" style="justify-content: center; flex-direction: row">
              Enter another key
            </button>
          </div>
        </div>
      </div>
    </figure>
    <figure>
      <figcaption>Browser limit reached</figcaption>
      <div class="sc">
        <div class="sh" role="dialog">
          <div class="gr"></div>
          <button class="x" aria-label="Close">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
          <div style="display: flex; flex-direction: column; gap: 12px" role="alert">
            <div class="hd pe">
              <h2 class="ti">
                <svg
                  style="color: var(--muted-foreground); flex: none"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 8v4M12 16h.01" /></svg
                >This key is in use in 3 browsers
              </h2>
              <p class="ds">
                Your purchase is fine. A 30-day pass works in up to 3 browsers; a year pass in up to
                30.
              </p>
            </div>
            <p class="mut">
              Open your purchase page to see the key, or email support and we will sort it out.
            </p>
          </div>
          <div class="ft">
            <a class="btn pri" href="#">Open purchase page</a
            ><button class="btn fmt" style="justify-content: center; flex-direction: row">
              Email support
            </button>
          </div>
        </div>
      </div>
    </figure>
  </body>
</html>
