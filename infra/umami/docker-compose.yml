# Self-hosted Umami for m.safeunfollow.app — see README.md in this directory.
#
# Three services, no published ports: Cloudflare reaches Umami through the
# tunnel (an outbound connection from `cloudflared`), so the VPS needs no
# inbound rule beyond SSH. That is also what makes `cf-connecting-ip`
# trustworthy — nothing can reach Umami without passing Cloudflare's edge.

name: umami

services:
  umami:
    # Pinned on purpose, and to the SAME version the Vercel instance runs at
    # migration time: the container applies Prisma migrations on start, and
    # `bin/sync-delta.sh` copies rows column-for-column from the old database.
    # Upgrade only after the cutover is finished.
    image: ghcr.io/umami-software/umami:${UMAMI_VERSION:?set UMAMI_VERSION in .env}
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      TRACKER_SCRIPT_NAME: ${TRACKER_SCRIPT_NAME:-}
      COLLECT_API_ENDPOINT: ${COLLECT_API_ENDPOINT:-}
      # Umami already prefers this header over X-Forwarded-For; naming it
      # pins the choice so a future header-order change cannot move it.
      CLIENT_IP_HEADER: cf-connecting-ip
      DISABLE_TELEMETRY: '1'
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    # Loopback only: for `ssh -L 3000:localhost:3000` checks before DNS moves.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/heartbeat || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./dumps:/dumps
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      umami:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
