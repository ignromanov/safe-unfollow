# Jekyll configuration for GitHub Pages
# This enables markdown processing for documentation

# Site settings
title: "Instagram Unfollow Tracker"
description: "Free Instagram unfollow tracker - analyze your followers and following"
baseurl: "/docs"
url: "https://safeunfollow.app"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Custom layout (no theme)

# Plugins
# jekyll-sitemap is deliberately absent: scripts/generate-sitemap.ts already emits
# every /docs/* URL into the site-wide sitemap.xml in the slash-free form Vercel
# actually serves. The plugin emitted a second sitemap at /docs/sitemap.xml listing
# only trailing-slash URLs, every one of which 308-redirects.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include files
include:
  - _redirects

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

  # One page keeps the old, over-long title on purpose.
  #
  # `/docs/instagram-export` is the second-largest object on the property — 34 568
  # impressions in the 91 days to 2026-09-02, at CTR 0.19% — and it is mid-recovery from an
  # unexplained W34 (Aug 17-23) collapse to position 48.6. The position-content plan
  # (.claude/plans/2026-09-02-position-content/, constraint 8 and task 05) holds it closed
  # until the W37 chart is readable, ~2026-09-15, so a copy change does not land on a
  # ranking that is still moving and make the recovery unattributable.
  #
  # The suffix lives in the shared layout, so dropping it would change that page's SERP
  # presentation without anyone editing the page. This freezes it instead. ⛔ Delete this
  # entry when task 05 ships — the title gate asserts the exception set holds exactly one
  # page, so leaving it behind fails the build.
  - scope:
      path: "instagram-export.md"
      type: "pages"
    values:
      title_suffix: true

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
