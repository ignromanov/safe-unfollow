# Jekyll configuration for GitHub Pages
# This enables markdown processing for documentation

# Site settings
title: "Instagram Unfollow Tracker"
description: "Free Instagram unfollow tracker - analyze your followers and following"
baseurl: "/docs"
url: "https://safeunfollow.app"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Custom layout (no theme)

# Plugins
# jekyll-sitemap is deliberately absent: scripts/generate-sitemap.ts already emits
# every /docs/* URL into the site-wide sitemap.xml in the slash-free form Vercel
# actually serves. The plugin emitted a second sitemap at /docs/sitemap.xml listing
# only trailing-slash URLs, every one of which 308-redirects.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include files
include:
  - _redirects

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
