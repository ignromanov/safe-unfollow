# Jekyll configuration for GitHub Pages
# This enables markdown processing for documentation

# Site settings
title: "Instagram Unfollow Tracker"
description: "Free Instagram unfollow tracker - analyze your followers and following"
baseurl: "/docs"
url: "https://safeunfollow.app"

# The publisher, named once so thirteen pages can assert the same entity.
#
# Overturns the GEO plan's §4 A1 exclusion of `Organization` from this layout, and states why in
# the place the next reader will look. That exclusion was reasoned — "cross-document `@id`
# resolution by Google's Search parser could not be confirmed from a primary source" — and it is
# still correct about resolution. It is answered by never requiring any: each page carries the
# **complete** node, not a bare `{"@id": ...}` reference to the home page's copy, so a consumer
# that resolves nothing still reads a self-describing organisation. The shared `@id` is a bonus
# for consumers that do merge, never a dependency.
#
# What changed to make it worth doing: the five-engine citation baseline of 2026-09-07 measured
# four of five AI engines resolving the string "SafeUnfollow" to an unrelated Chrome extension
# that automates unfollowing. The docs pages are the ones `llms.txt` routes engines to and the
# ones that rank — and until now they asserted no entity at all.
# ⛔ The count is deliberately not written here. This line said "these thirteen pages" while
# `llms.txt` routed engines to ten and the sources declared fourteen — one sentence conflating
# three different sets, none of them derived. The entity node goes on every docs page except
# `instagram-export.md`, which is exempted below; what `llms.txt` carries is gated against the
# sources by `llms-txt-lists-every-docs-page.test.ts` (GH#248). Both sets are computed, so a
# number restated here could only drift away from them.
# `.claude/analytics/2026-09-07-entity-resolution/00-the-entity-defects.md` §2 and §3.
# Since v1.7.0 the node also names its founder (a Person, `founder_id`), and the WebSite is named
# "SafeUnfollow" like the app's (plan 2026-11-09-seo-aeo-geo, task 01).
#
# ⛔ Every value below is duplicated from `src/components/OrganizationSchema.tsx`, because
# Jekyll and Vite are separate builds with no shared source. `jekyll-structured-data.test.ts`
# reads both files and fails when they disagree — that gate is the only thing keeping one entity
# from being published as two.
entity:
  id: "https://safeunfollow.app/#organization"
  website_id: "https://safeunfollow.app/#website"
  founder_id: "https://safeunfollow.app/#founder"
  name: "SafeUnfollow"
  alternate_name:
    - "SafeUnfollow.app"
    - "Instagram Unfollow Tracker"
  website_alternate_name:
    - "SafeUnfollow.app"
    - "safeunfollow.app"
  url: "https://safeunfollow.app"
  logo: "https://safeunfollow.app/logo.svg"
  same_as:
    - "https://github.com/ignromanov/safe-unfollow"
    - "https://www.crunchbase.com/organization/safeunfollow"
    - "https://www.producthunt.com/products/instagram-unfollow-tracker"
    - "https://doi.org/10.5281/zenodo.22663615"
    - "https://www.instagram.com/safeunfollow"
    - "https://www.youtube.com/@SafeUnfollowapp"
    - "https://www.tiktok.com/@safeunfollow.app"
  description: "SafeUnfollow is a web app that reads the official Instagram data export in your browser and shows who unfollowed you, who does not follow back, and who is mutual. The analysis is free and needs no Instagram login. SafeUnfollow never sends the export to a server."
  disambiguating_description: "SafeUnfollow is the web app at safeunfollow.app. It reads the Instagram data export you choose and never acts inside your Instagram account. SafeUnfollow.app is not affiliated with safeunfollow.com or with any browser extension named SafeUnfollow."
  founder:
    name: "Ignat Romanov"
    url: "https://lasipan.cc/"
    job_title: "Builder & Web3 Frontend Engineer"
    description: "Builder & Web3 Frontend Engineer — crafting privacy-first tools for the decentralized economy."
    same_as:
      - "https://github.com/ignromanov"
      - "https://lasipan.cc/"
      - "https://www.linkedin.com/in/ignat-romanov"
      - "https://x.com/romignov"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Custom layout (no theme)

# Plugins
# jekyll-sitemap is deliberately absent: scripts/generate-sitemap.ts already emits
# every /docs/* URL into the site-wide sitemap.xml in the slash-free form Cloudflare
# actually serves. The plugin emitted a second sitemap at /docs/sitemap.xml listing
# only trailing-slash URLs, every one of which redirects.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include files
include:
  - _redirects

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
