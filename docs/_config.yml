# Jekyll configuration for GitHub Pages
# This enables markdown processing for documentation

# Site settings
title: "Instagram Unfollow Tracker"
description: "Free Instagram unfollow tracker - analyze your followers and following"
baseurl: "/docs"
url: "https://safeunfollow.app"

# The publisher, named once so thirteen pages can assert the same entity.
#
# Overturns the GEO plan's §4 A1 exclusion of `Organization` from this layout, and states why in
# the place the next reader will look. That exclusion was reasoned — "cross-document `@id`
# resolution by Google's Search parser could not be confirmed from a primary source" — and it is
# still correct about resolution. It is answered by never requiring any: each page carries the
# **complete** node, not a bare `{"@id": ...}` reference to the home page's copy, so a consumer
# that resolves nothing still reads a self-describing organisation. The shared `@id` is a bonus
# for consumers that do merge, never a dependency.
#
# What changed to make it worth doing: the five-engine citation baseline of 2026-09-07 measured
# four of five AI engines resolving the string "SafeUnfollow" to an unrelated Chrome extension
# that automates unfollowing. These thirteen pages are the ones `llms.txt` routes engines to and
# the ones that rank — and until now they asserted no entity at all.
# `.claude/analytics/2026-09-07-entity-resolution/00-the-entity-defects.md` §2 and §3.
#
# ⛔ These four strings are duplicated from `src/components/OrganizationSchema.tsx`, because
# Jekyll and Vite are separate builds with no shared source. `jekyll-structured-data.test.ts`
# reads both files and fails when they disagree — that gate is the only thing keeping one entity
# from being published as two.
entity:
  id: "https://safeunfollow.app/#organization"
  website_id: "https://safeunfollow.app/#website"
  name: "SafeUnfollow"
  alternate_name: "Instagram Unfollow Tracker"
  url: "https://safeunfollow.app"
  logo: "https://safeunfollow.app/logo.svg"
  same_as:
    - "https://github.com/ignromanov/safe-unfollow"
    - "https://www.crunchbase.com/organization/safeunfollow"
  description: "SafeUnfollow is a free web app that reads the official Instagram data export in your browser and shows who unfollowed you, who does not follow back, and who is mutual. The export is parsed on your own device and never uploaded, and no Instagram login is required."
  disambiguating_description: "SafeUnfollow is the web app at safeunfollow.app. It is not a browser extension, it does not act inside an Instagram session, and it never follows or unfollows anyone on your behalf."

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Custom layout (no theme)

# Plugins
# jekyll-sitemap is deliberately absent: scripts/generate-sitemap.ts already emits
# every /docs/* URL into the site-wide sitemap.xml in the slash-free form Vercel
# actually serves. The plugin emitted a second sitemap at /docs/sitemap.xml listing
# only trailing-slash URLs, every one of which 308-redirects.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include files
include:
  - _redirects

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

  # One page keeps the old, over-long title on purpose.
  #
  # `/docs/instagram-export` is the second-largest object on the property — 34 568
  # impressions in the 91 days to 2026-09-02, at CTR 0.19% — and it is mid-recovery from an
  # unexplained W34 (Aug 17-23) collapse to position 48.6. The position-content plan
  # (.claude/plans/2026-09-02-position-content/, constraint 8 and task 05) holds it closed
  # until the W37 chart is readable, ~2026-09-15, so a copy change does not land on a
  # ranking that is still moving and make the recovery unattributable.
  #
  # The suffix lives in the shared layout, so dropping it would change that page's SERP
  # presentation without anyone editing the page. This freezes it instead. ⛔ Delete this
  # entry when task 05 ships — the title gate asserts the exception set holds exactly one
  # page, so leaving it behind fails the build.
  - scope:
      path: "instagram-export.md"
      type: "pages"
    values:
      title_suffix: true
      # Same freeze, second consequence: a BreadcrumbList can change the URL line Google shows
      # under the title, and this page's snippet is the object being measured. GH#189 rules the
      # same way. ⛔ Delete this with the line above it — one exemption, both halves.
      no_structured_data: true

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
